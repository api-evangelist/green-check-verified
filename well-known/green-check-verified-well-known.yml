source: live probes of /.well-known/ on every Green Check host (website, developer portal, app, prod + sandbox API)
summary: >-
  One real document is served across the whole estate: RFC 8414 OAuth authorization-server metadata on
  the developer portal host. It is the discovery document for the portal's own hosted MCP server
  (endpoints under /_mcp/), which is how the live MCP server at https://developer.greencheckverified.com/mcp
  was found. Nothing else is served anywhere — no security.txt, no api-catalog, no OIDC discovery, no
  ai-plugin.json, and no A2A agent card on any host.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the single 200 carrying real JSON on
  developer.greencheckverified.com. SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on
  every host, so no Security/SecurityTxt claim is made on this provider's behalf.
false_positive_watch: >-
  app.greencheckverified.com answers HTTP 200 with the React SPA shell (1512 bytes, identical body)
  for EVERY /.well-known/* path including paths that cannot exist. Those eight 200s are recorded
  below as misses, not hits. The prod/sandbox API hosts are AWS API Gateway and answer every
  /.well-known/* path with 403 {"message":"Missing Authentication Header"} — also a miss, not a
  gated document.
