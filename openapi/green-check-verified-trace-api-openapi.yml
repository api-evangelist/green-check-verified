      summary: Proxy Trace Put Requests
      tags:
      - Trace
      security:
      - access_auth:
        - trace
        - admin
      parameters: []
    delete:
      operationId: ProxyDelete
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
