              $ref: '#/components/schemas/ShortDate'
              description: Established Date
            website:
              $ref: '#/components/schemas/Website'
              description: Website
            phone_number:
              $ref: '#/components/schemas/PhoneNumber'
              description: 'Phone Number - (###) ####-####'
            ein:
              $ref: '#/components/schemas/EIN'
              description: 'EIN (Employer Identification Number) - ##-#######'
            mailing_postal_code:
              $ref: '#/components/schemas/PostalCode'
              description: Mailing Postal Code
            mailing_state:
              $ref: '#/components/schemas/USStates'
              description: Mailing State
            mailing_city:
              $ref: '#/components/schemas/City'
              description: Mailing City
            mailing_street_address:
              type: string
              description: Mailing Street Address
            country:
              $ref: '#/components/schemas/Countries'
              description: Country
            postal_code:
              $ref: '#/components/schemas/PostalCode'
              description: Postal Code
            city:
              $ref: '#/components/schemas/City'
              description: City
            street_address_2:
              type: string
              description: Street Address 2
            street_address:
              type: string
              description: Street Address
            primary_contact_email:
              type: string
              description: >-
                Primary contact email of the CRB to help facilitate notification
                emails. If not provided, default to support
            business_type:
              $ref: '#/components/schemas/DispensaryBusinessType'
              description: Crb's business type (retail or wholesale)
            template_id:
              $ref: '#/components/schemas/UUID'
              description: Onboarding Template Id to assign the CRB
            timezone:
              $ref: '#/components/schemas/IANATimezones'
              description: >-
                Crb's IANA Timezone. If not provided, will default to default
                value for state
            state:
              $ref: '#/components/schemas/USStates'
              description: State
            name:
              type: string
          required:
            - business_type
            - state
            - name
          type: object
        pos_info:
          properties:
            location_id:
              anyOf:
                - type: string
                - type: number
                  format: double
              description: >-
                Location ID to specify which specific location within the POS is
                related to this CRB. Optional.

                If not provided and the selected POS requires location ID, we
                will return an error message

                with available locations so that you can provide one and call
                again
            pos_credentials:
              $ref: '#/components/schemas/PosCredentials'
              description: POS credentials specific to the POS
            pos_type:
              $ref: '#/components/schemas/AvailablePosTypes'
              description: Point-of-Sale type of the CRB
          required:
            - pos_credentials
            - pos_type
          type: object
        users:
          items:
            properties:
              phone:
                type: string
              email:
                type: string
              lastName:
                type: string
              firstName:
                type: string
            required:
              - email
              - lastName
              - firstName
            type: object
          type: array
          description: CRB users to invite
        options:
          properties:
            onboarding_required:
              type: boolean
              description: >-
                True to leave this CRB in pending state. Requires users to be
                present so that we can invite them to complete onboarding
                on-app. Defaults to false and CRBs are auto-approved.
          type: object
      required:
        - org
      type: object
      additionalProperties: false
