    AlleavesTestAuth:
      description: >-
        You can connect your Alleaves account to Green Check by simply using
        your Alleaves username and password. First, you'll want to ensure that
        your user has the proper API access permissions in order for the
        integration to succeed. If your user has admin permissions, it should
        have the proper access by default.


        https://support.greencheckverified.com/knowledge/connect-alleaves-to-green-check
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
      type: object
      additionalProperties: false
    BiotrackTestAuth:
      description: >-
        BioTrack enables its users to connect to other systems like Green Check
        with something called a SQL to SQL Pipeline. This simply means that
        Green Check will have read-only access to your BioTrack data. First,
        you'll need to ask BioTrack to email you the necessary credentials for
        the integration. Copy and paste the email below and send it to
        Support@biotrackthc.com. Then, you'll need to configure BioTrack to
        grant Green Check access, follow the instructions found here:
        https://f.hubspotusercontent20.net/hubfs/5237927/Connect%20BioTrack%20to%20Green%20Check.pdf.
        If your Network Connection requires you to whitelist Green Check's IP,
        please add these IP addresses to your whitelist: 52.4.48.232 and
        35.169.209.100


        Hello,

        I need some assistance. I would like to integrate our system with the
        Green Check system. Please provide me with the necessary information
        about our database that the Green Check team needs for Read Only access.


        https://support.greencheckverified.com/knowledge/connect-biotrack-to-green-check

        https://support.greencheckverified.com/knowledge/how-to-handle-biotrack-connection-refusal-errors

        https://support.greencheckverified.com/knowledge/how-to-handle-biotrack-pg_hba.conf-errors
      properties:
        username:
          type: string
        password:
          type: string
        server_ip:
          type: string
        port:
          type: number
          format: double
        database_name:
          type: string
      required:
        - username
        - password
        - server_ip
        - port
        - database_name
      type: object
      additionalProperties: false
    BlazeTestAuth:
      description: >-
        Blaze provides its users with a unique Developer Key that can be used to
        integrate with other systems like Green Check. In order to connect with
        third party applications, you will need to generate a developer key from
        the backend of BLAZE Retail. Follow the instructions in the link below
        to generate a key.


        https://support.greencheckverified.com/knowledge/connect-blaze-to-green-check
      properties:
        Authorization:
          type: string
      required:
        - Authorization
      type: object
      additionalProperties: false
    BrytemapTestAuth:
      description: >-
        Brytemap provides its users with a unique Client Key that can be used to
        integrate with other systems like Green Check. First, you'll need to ask
        Brytemap to add your Client Key to Green Check's Brytemap account. Copy
        and paste the email below and send it to support@brytemap.com.


        Hello,

        I need some assistance. I would like to integrate our system with the
        Green Check system. Please help me by providing access to Green Check's
        Brytemap Partners account. This account is set up under
        engineering@greencheckverified.com.


        https://support.greencheckverified.com/knowledge/connect-brytemap-to-green-check
      properties:
