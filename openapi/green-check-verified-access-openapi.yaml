          in: query
          name: limit
          required: false
          schema:
            default: 1000
            format: int32
            type: integer
            minimum: 1
            maximum: 1000
        - description: The page offset
          in: query
          name: offset
          required: false
          schema:
            default: 0
            format: int32
            type: integer
            minimum: 0
        - description: License number / identifier
          in: query
          name: licenseNumber
          required: false
          schema:
            type: string
        - description: Name of licensee or holding business
          in: query
          name: name
          required: false
          schema:
            type: string
        - description: >-
            State of Licensing Authority (CAN = Cananda, NLA = No Licensing
            Authority)
          in: query
          name: state
          required: false
          schema:
            $ref: '#/components/schemas/BusinessLicenseState'
        - description: License Type
          in: query
          name: licenseType
          required: false
          schema:
            $ref: '#/components/schemas/CRBMUniformLicenseTypeDescription'
