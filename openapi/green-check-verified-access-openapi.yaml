        - id
        - org_id
        - s3_key
        - file_name
        - uploaded_by
        - upload_date
        - deleted
      type: object
      additionalProperties: false
    AccessScopes:
      enum:
        - service-provider:read
        - service-provider:write
        - crb:read
        - point-of-sale:read
        - point-of-sale:write
        - trace
        - admin
        - ein:read
        - crb-id-request:read
        - create-crb-api-key:write
        - connect-crb-to-sp:write
      type: string
    AuthResponse:
      properties:
        access_token:
          type: string
          description: Bearer token passed with request
        token_type:
          type: string
          enum:
            - Bearer
          nullable: false
          description: Access returns a Bearer token
        scope:
          items:
            $ref: '#/components/schemas/AccessScopes'
          type: array
          description: List of scopes this token has access to
        expires_at:
          type: number
          format: double
          description: Seconds until this token expires
        client_id:
          type: string
          description: Your client Id
        issued_at:
          type: number
          format: double
          description: >-
            When the token was issued, expressed as the number of seconds since
            the Unix epoch
      required:
        - access_token
        - token_type
        - scope
        - expires_at
        - client_id
        - issued_at
      type: object
      additionalProperties: false
    AccessGrantType:
      enum:
        - client_credentials
      type: string
    TokenRequestBody:
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          $ref: '#/components/schemas/AccessGrantType'
        scope:
          items:
            $ref: '#/components/schemas/AccessScopes'
          type: array
      required:
        - client_id
        - client_secret
        - grant_type
      type: object
      additionalProperties: false
  securitySchemes:
    access_auth:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        type: request
        identitySource: method.request.header.Authorization
        authorizerUri:
          Fn::Sub: >-
            arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AccessAuthorizerLambda.Arn}/invocations
        authorizerCredentials:
          Fn::Sub: ${AccessApiGatewayRole.Arn}
        authorizerResultTtlInSeconds: 60
