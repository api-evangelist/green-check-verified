      type: object
      additionalProperties: false
    GreenbitsTestAuth:
      description: >-
        To share your API token with Green Check, you will need to set up a new
        Role and User account in Greenbits that Green Check will use to access
        the token. Ensure this role has the following permissions: View
        Products, Access Backoffice, View product types, View brands, View
        strains, View suppliers. Follow the instructions in the link below to
        set this up.


        https://support.greencheckverified.com/en/knowledge/connect-greenbits-to-green-check
