      description: City
      pattern: ^[a-zA-Z\s.-]+$
    PostalCode:
      type: string
      description: Postal Code
      pattern: ^\d{5}(?:[-\s]?\d{4})?$
    PhoneNumber:
      type: string
      description: 'Phone Number - (###) ####-####'
      pattern: ^\(\d{3}\)\s\d{3}-\d{4}$
