          description: DBA (Doing Business As)
        monthlySales:
          $ref: '#/components/schemas/PositiveInteger'
          description: Monthly Sales
        monthlyCustomers:
          $ref: '#/components/schemas/PositiveInteger'
          description: Monthly Customers
