      enum:
      - bank_disconnected
      - bank_approved
      - bank_review_in_progress
      - bank_awaiting_review
      - bank_in_progress
      - bank_pending
      - gcv_approved
      - gcv_awaiting_review
      - gcv_in_progress
      - gcv_pending
      - update_required
      type: string
    EIN:
      type: string
      description: 'EIN (Employer Identification Number) - ##-#######'
      pattern: ^\d{2}-\d{7}$
