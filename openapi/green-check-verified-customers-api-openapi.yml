      summary: Get CRB customer record by ID
      tags:
      - Customers
      security:
      - access_auth:
        - point-of-sale:read
        - admin
      parameters:
      - description: CRB Id
        in: path
        name: crb_id
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
      - description: Customer Id
        in: path
        name: customer_id
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
components:
  schemas:
    ValidateError:
      properties:
        name:
          type: string
          default: Validation Failed
        message:
          type: string
        stack:
          type: string
        status:
          type: number
          format: double
          default: 422
        fields:
          $ref: '#/components/schemas/FieldErrors'
        data: {}
      required:
      - name
      - message
      - status
      - fields
      type: object
      additionalProperties: false
    UUID:
      type: string
      format: uuid
      pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
    Gender:
      enum:
      - Male
      - Female
      - Other
      type: string
    MedicalOrRec:
      enum:
      - medical
      - rec
      type: string
    Customer:
      properties:
        crb_id:
          $ref: '#/components/schemas/UUID'
          description: ID of the CRB the customer record belongs to.
        id:
          $ref: '#/components/schemas/UUID'
          description: The unique ID of this customer record.
        pos_type:
          $ref: '#/components/schemas/FriendlyPosName'
          description: the PosType the customer record is sourced from
        pos_customer_id:
          type: string
          description: ID of the customer in the POS
        first_name:
          type:
          - string
          - 'null'
          description: Hashed first name
        last_name:
          type:
          - string
          - 'null'
          description: Hashed last name
        middle_name:
          type:
          - string
          - 'null'
          description: Hashed middle name
        dob:
          type:
          - string
          - 'null'
          description: Plain date field for customer date of birth
        address_1:
          type:
          - string
          - 'null'
          description: Customer address
        address_2:
          type:
          - string
          - 'null'
          description: Additional Customer address
        city:
          type:
          - string
          - 'null'
          description: City
        state:
          type:
          - string
          - 'null'
          description: State
        zip_code:
          type:
          - string
          - 'null'
          description: Zip code
        phone:
          type:
          - string
          - 'null'
          description: Hashed phone number
        cell_phone:
          type:
          - string
          - 'null'
          description: Hashed cell phone number
        email_address:
          type:
          - string
          - 'null'
          description: Hashed email address
        gender:
          allOf:
          - $ref: '#/components/schemas/Gender'
          description: Gender
          type:
          - string
          - 'null'
        pos_identification_type:
          type:
          - string
          - 'null'
          description: Main form of identification used by the customer
        pos_customer_type:
          type:
          - string
          - 'null'
          description: Raw POS value for customer type, used to determine if medical or recreational
        gc_customer_type:
          allOf:
          - $ref: '#/components/schemas/MedicalOrRec'
          description: Customer type determined by GCV, Medical or Recreational
          type:
          - string
          - 'null'
        medical_id:
          type:
          - string
          - 'null'
          description: Hashed medical ID
        medical_id_expiration_date:
          type:
          - string
          - 'null'
          description: Medical ID expiration date
        drivers_license_id:
          type:
          - string
          - 'null'
          description: Hashed drivers license ID
        drivers_license_expiration_date:
          type:
          - string
          - 'null'
          description: Drivers license expiration date
        other_id:
          type:
          - string
          - 'null'
          description: Hashed other license ID
        other_id_expiration_date:
          type:
          - string
          - 'null'
          description: Other ID expiration
        caregiver:
          type:
          - boolean
          - 'null'
          description: True if this customer is a caregiver
        loyalty_member:
          type:
          - boolean
          - 'null'
          description: True if this customer is a loyalty member
        loyalty_points:
          allOf:
          - $ref: '#/components/schemas/PositiveDouble'
          description: Number of accrued loyalty points
          type:
          - string
          - 'null'
        anonymous:
          type:
          - boolean
          - 'null'
          description: True if this is an anonymous customer, can depend on the state
        pos_updated_date:
          type:
          - string
          - 'null'
          description: the timestamp reported by the pos for the last update to this record in UTC
        pos_updated_date_local:
          type:
          - string
          - 'null'
          description: the timestamp reported by the pos for the last update to this record in the crb local time
        gc_updated_date:
          type:
          - string
          - 'null'
          description: the timestamp of this records insertion/updates in UTC
        gc_created_date:
          type:
          - string
          - 'null'
      required:
      - crb_id
      - id
      - pos_type
      - pos_customer_id
      - first_name
      - last_name
      - middle_name
      - dob
      - address_1
      - address_2
      - city
      - state
      - zip_code
      - phone
      - cell_phone
      - email_address
      - gender
      - pos_identification_type
      - pos_customer_type
      - gc_customer_type
      - medical_id
      - medical_id_expiration_date
      - drivers_license_id
      - drivers_license_expiration_date
      - other_id
      - other_id_expiration_date
      - caregiver
      - loyalty_member
      - loyalty_points
      - anonymous
      - pos_updated_date
      - pos_updated_date_local
      - gc_updated_date
      - gc_created_date
      type: object
      additionalProperties: false
    ForbiddenError:
      properties:
        name:
          type: string
          default: Forbidden
        message:
          type: string
        stack:
          type: string
        status:
          type: number
          format: double
          default: 403
        data: {}
      required:
      - name
      - message
      - status
      type: object
      additionalProperties: false
    NotFoundError:
      properties:
        name:
          type: string
          default: Not Found
        message:
          type: string
        stack:
          type: string
        status:
          type: number
          format: double
          default: 404
        data: {}
      required:
      - name
      - message
      - status
      type: object
      additionalProperties: false
    PagedCustomers:
      properties:
        metadata:
          properties:
            total:
              $ref: '#/components/schemas/PositiveInteger'
            count:
              type: string
              description: Range of items returned
          required:
          - total
          - count
          type: object
        data:
          items:
            $ref: '#/components/schemas/Customer'
          type: array
      required:
      - metadata
      - data
      type: object
      additionalProperties: false
    PositiveInteger:
      type: integer
      format: int32
      minimum: 0
    FieldErrors:
      properties: {}
      type: object
      additionalProperties:
        properties:
          value: {}
          message:
            type: string
        required:
        - message
        type: object
    FriendlyPosName:
      type: string
      enum:
      - Alleaves
      - Dutchie
      - Dutchie Wholesale
      - Cova
      - Meadow
      - MJ Freeway
      - MJ Freeway Wholesale
      - Greenbits
      - GrowFlow
