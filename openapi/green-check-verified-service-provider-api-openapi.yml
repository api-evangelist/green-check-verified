  schemas:
    Proteus420TestAuth:
      description: 'To configure this integration, you’ll need your Proteus420 Client Name and API Key. The Client Name will be the Proteus420 account name that shows on the top of the Proteus420 homepage when logged in. The API Key can be accessed and generated on the web services page (Settings>webservices). There will be a unique API Key for each location.


        https://support.greencheckverified.com/knowledge/connect-proteus420-to-green-check'
      properties:
        apiKey:
          type: string
        clientName:
          type: string
      required:
      - apiKey
      - clientName
      type: object
      additionalProperties: false
    BiotrackTestAuth:
      description: 'BioTrack enables its users to connect to other systems like Green Check with something called a SQL to SQL Pipeline. This simply means that Green Check will have read-only access to your BioTrack data. First, you''ll need to ask BioTrack to email you the necessary credentials for the integration. Copy and paste the email below and send it to Support@biotrackthc.com. Then, you''ll need to configure BioTrack to grant Green Check access, follow the instructions found here: https://f.hubspotusercontent20.net/hubfs/5237927/Connect%20BioTrack%20to%20Green%20Check.pdf. If your Network Connection requires you to whitelist Green Check''s IP, please add these IP addresses to your whitelist: 52.4.48.232 and 35.169.209.100


        Hello,

        I need some assistance. I would like to integrate our system with the Green Check system. Please provide me with the necessary information about our database that the Green Check team needs for Read Only access.


        https://support.greencheckverified.com/knowledge/connect-biotrack-to-green-check

        https://support.greencheckverified.com/knowledge/how-to-handle-biotrack-connection-refusal-errors

        https://support.greencheckverified.com/knowledge/how-to-handle-biotrack-pg_hba.conf-errors'
      properties:
        username:
          type: string
        password:
          type: string
        server_ip:
          type: string
        port:
          type: number
          format: double
        database_name:
          type: string
