    One scheme, described two ways. The docs describe OAuth 2.0 client credentials: POST /auth/token
    with client_id + client_secret + grant_type, returning a Bearer access_token, a scope array and an
    expires_at timestamp, valid 3600 seconds. The OpenAPI models the same thing as an apiKey scheme
    named `access_auth` carried in the Authorization header, backed by an AWS API Gateway custom
    Lambda authorizer. Per-operation scope requirements ARE declared in the spec under that scheme.
