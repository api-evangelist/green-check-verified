credential_issuance:
  path: >-
    client_id and client_secret are issued to a service provider by Green Check during commercial
    onboarding — the docs' "Choosing Your CRB Onboarding Path" guide begins "At this point you have
    your contract signed, your API credentials, and access to the Green Check web UI." There is no
    self-service key generation; a signed contract precedes access.
  delegated_credentials:
    operationId: generate-crb-access-creds
    path: POST /service-providers/{sp_id}/crbs/{crb_id}/access
    description: >-
      A service provider can mint Green Check Access credentials on behalf of a connected CRB, to
      operate that CRB's document-management calls. No revoke or rotate operation is published.
token_handling_guidance:
  - Tokens expire 3600 seconds after issue; check expires_at (unix) and re-authenticate before it passes.
  - The docs warn that missing refresh logic produces unexpected 401s in production.
  - client_secret must never be exposed in client-side code (stated in the tutorial).
