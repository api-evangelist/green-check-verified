  all: every one of the 6 MCP tools operates on the DOCUMENTATION (list APIs, read endpoints, fetch the
  OpenAPI, search the docs), and every one of the 49 REST operations is unreachable from MCP. There is
  no tool that reads a CRB, pulls sales, or creates an onboarding invite. An agent pointed at this MCP
  server can fully learn the Access API and cannot execute a single Access API call through it.
