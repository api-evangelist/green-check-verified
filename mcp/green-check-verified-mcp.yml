    tools:
      listChanged: true
tools_file: green-check-verified-mcp-tools.json
tool_count: 6
tools:
- name: list-apis
  description: Lists available APIs with their context and purpose
  inputs:
  - filter
  - page
  - limit
- name: get-endpoints
  description: Get all endpoints for a specific API
  inputs:
  - name
- name: get-endpoint-info
  description: Get comprehensive information about specific endpoint including parameters, security, and
    examples
  inputs:
  - name
  - path
  - method
- name: get-security-schemes
  description: Get the security schemes for a specific API
  inputs:
  - name
- name: get-full-api-description
  description: Get the complete OpenAPI description
  inputs:
  - name
- name: search
  description: Search across the documentation to fetch relevant content for a given query
  inputs:
  - query
provenance_caveat: The server is provided by the Redocly-hosted developer portal rather than hand-built
  by Green Check, and its tool set is identical across Redocly portals. It is nonetheless served from
  Green Check's own host, reachable by any agent with no credentials, and returns Green Check's own OpenAPI
  — so it is recorded as a real remote MCP surface. It is NOT evidence that the Access API itself is callable
  through MCP.
