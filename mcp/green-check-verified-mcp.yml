summary: 'Green Check runs a live, anonymously reachable remote MCP server on its developer-portal host.
  It is the Redocly-portal documentation MCP: six tools that let an agent enumerate the APIs, list endpoints,
  read per-endpoint parameters/security/examples, pull the complete OpenAPI description, and full-text
  search the docs. It is a documentation-navigation surface, NOT a business-operations surface — none
  of the six tools calls the Green Check Access API itself, so an agent can learn the contract through
  MCP but must still call prod-api.greencheckverified.com over REST to do anything.'
deployment:
  mode: remote
  endpoint: https://developer.greencheckverified.com/mcp
  auth: none
  verified: probed
discovery:
  found_via: https://developer.greencheckverified.com/.well-known/oauth-authorization-server (HTTP 200)
    names authorization/token/registration endpoints under /_mcp/, which pointed at the MCP surface. The
    /_mcp path itself returns the portal HTML shell; the JSON-RPC endpoint is /mcp.
  oauth_metadata: well-known/green-check-verified-developer-oauth-authorization-server.json
  note: OAuth authorization-server metadata is published (issuer auth.cloud.redocly.com, dynamic client
    registration, PKCE S256), but tools/list answers unauthenticated, so no token is required for the
    tool surface as deployed today.
server_info:
  name: MCP server
  version: '2026-08-22'
  protocol_version: '2025-06-18'
  transport: streamable-http (text/event-stream responses)
  capabilities:
