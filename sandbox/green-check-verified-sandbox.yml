summary: >-
  Green Check runs a real, separately-hosted sandbox and — unusually for a sales-gated B2B API —
  publishes deterministic magic values that simulate every POS-connection failure mode. Every worked
  example in the docs and tutorials targets the sandbox host, not production. Credentials are still
  issued by Green Check; there is no self-service sandbox signup.
environments:
  - name: sandbox
    base_url: https://sandbox-api.greencheckverified.com
    described_in_spec: true
    spec_description: Sandbox server
    default_in_docs: true
    note: >-
      Every curl example and the complete Python client in the tutorials default to this host. Test POS
      calls against it are simulated, not real connections.
  - name: production
    base_url: https://prod-api.greencheckverified.com
    described_in_spec: true
    spec_description: Production server
credentials:
  self_service: false
  how_obtained: >-
    client_id and client_secret are issued by Green Check as part of commercial onboarding. The
    "Choosing Your CRB Onboarding Path" guide begins with the contract already signed. There is no
    public sandbox key.
  key_prefixes: none published
test_values:
  note: >-
    Verbatim from Green Check's published testing-scenarios block on the create-CRB operation. These
    are the provider's own documented simulation values — nothing here is invented.
  pos_connection:
    pos_type: Greenbits
    username: testing
    cases:
      - password: testing
        simulates: valid credentials — successful connection
      - password: invalid_testing
        simulates: invalid credentials — connection rejected
  location_id:
    - value: ''
      simulates: missing required location — response returns the list of available location options
    - value: invalidLocation
      simulates: invalid location — response returns the list of available location options
    - value: testing
      simulates: successful connection, with no actual POS connection made
  validation:
    - scenario: >-
        Provide pos_info naming a wholesale POS while org.business_type = "retail"
      expects: 422 validation error (business_type must match pos_type)
