apis:
- name: Green Check Access
  description: 'Green Check Access is Green Check''s public REST API suite for service providers —
    financial institutions, payroll companies, CRMs and other platforms serving the cannabis industry.
    It exposes 49 operations across service-provider, CRB onboarding, onboarding-template, document,
    sales, product, inventory, inventory-location and customer resources, plus an OAuth 2.0
    client-credentials token endpoint and a pass-through Trace proxy to state track-and-trace systems.
    Data for sales, products, inventory and customers is sourced from the CRB''s connected
    point-of-sale or seed-to-sale system and normalized across providers.'
