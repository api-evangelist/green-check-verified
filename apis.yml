aid: green-check-verified
name: Green Check Verified
description: 'Green Check Verified (Green Check) is a New Haven, Connecticut specialty-banking compliance
  platform founded in 2017 that sits between financial institutions and the cannabis and other cash-intensive
  businesses they serve. Banks and credit unions use it to onboard cannabis-related businesses (CRBs),
  collect and review due-diligence documentation, validate that deposits trace to legally licensed sales,
  monitor licenses and negative news, and produce the BSA/AML oversight reporting examiners require. Its
  public developer product, Green Check Access, is a REST API suite that normalizes compliance, company
  and transactional data across more than twenty point-of-sale and seed-to-sale systems — Dutchie, Treez,
  Flowhub, Biotrack, Metrc, Cova, Canix, Greenbits and others — so service providers such as payroll
  companies, CRMs, lenders and fintechs can programmatically create and onboard CRBs and read their sales,
  products, inventory, customer and document data through one contract instead of one integration per POS.'
